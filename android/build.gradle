// Expo's module Gradle plugin: applies Kotlin, the core dependencies,
// publishing and the Android SDK versions of the app's Expo SDK. From Expo
// SDK 57 it also applies the Pika compiler plugin, without which the
// module's Kotlin definition throws at startup ("This function has a reified
// type parameter…"); the legacy ExpoModulesCorePlugin.gradle never applies it.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.thermalibexpo'
version = '0.1.0'

android {
  namespace "expo.modules.thermalibexpo"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.facebook.react:react-android")
  // The ETI ThermaLib library, wrapped as a project by
  // expo-module.config.json's gradleAarProjects.
  implementation project(":${project.name}\$thermalib-aar")
}
